<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <title>CASWear</title>
</head>

<body class="bg-color">

<nav class="navbar">

    <div class="logo-container">
        <img src="logo.png" class="logo-img">
    </div>

    <div class="nav-links">
        <a href="home.html">HOME</a>
        <a href="apparel.html">APPAREL</a>
        <a href="cart.html">CART</a>
        <a href="orders.html">ORDERS</a>
        <a href="about.html">ABOUT</a>
    </div>

    <div class="nav-right">

    

        <div class="notification">

            <button class="notif-btn" onclick="toggleNotif()">

                <i class="fa-solid fa-bell"></i>

                <span class="notif-count" id="notifCount">0</span>

            </button>

            <div class="notif-dropdown" id="notifDropdown">

                <h3>Notifications</h3>

                <div id="notifList">

                    <p class="no-notif">No notifications.</p>

                </div>

            </div>

        </div>

    

    <div class="profile">

    <button class="profile-btn" onclick="toggleProfile()" type="button">

        <img src="logo.png"
            class="profile-img"
            id="navProfilePicture"
            alt="Profile">
        <span id="userName">Hi, CASmate!</span>

        <i class="fa-solid fa-chevron-down"></i>

   </button>

 <div class="profile-dropdown" id="profileDropdown">

        <a href="profile.html">
            <i class="fa-solid fa-user"></i>
            View Profile
        </a>

        <a href="settings.html">
            <i class="fa-solid fa-gear"></i>
            Settings
        </a>

        <a href="help.html">
            <i class="fa-solid fa-circle-question"></i>
            Help
        </a>

        <a href="javascript:void(0);" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
            </a>

    </div>

</div>
</div>
    </div>

</nav>

<div class="shirt-page">

    <!-- BREADCRUMB -->
    <div class="breadcrumb">
        <a href="home.html">Home</a>
        <span>›</span>
        <a href="stat.html">Apparel</a>
        <span>›</span>
        <strong>Lanyard</strong>
    </div>


    <!-- PRODUCT CONTENT -->
    <div class="shirt-content">

        <!-- IT SHIRT IMAGE -->
        <div class="shirt-image-container">

            <img src="statlanyard.png"
                 alt="IT Shirt"
                 class="shirt-image">

        </div>


        <!-- PRODUCT INFORMATION -->
        <div class="shirt-info">

            <h1>Statistics Lanyard</h1>

            <div class="shirt-price">
                ₱ 100.00
            </div>

            <p class="shirt-description">
                Official ID Lanyard for Statistics
                
            </p>

            <ul>
                <li>High Quality</li>
                <li>Washable</li>
            </ul>

        </div>


        <!-- SIZE AND QUANTITY -->
        <div class="shirt-options">

            

            <label for="quantity">Quantity:</label>

            <select id="quantity">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>


            <button
        class="add-cart-btn"
        onclick="addToCart(event)"
        data-id="stat-shirt"
        data-name="Statistics Lanyard"
        data-price="100"
        data-image="Statlanyard.png">

        ADD TO CART
            </button>

        </div>

    </div>

</div>

<script type="module" src="home.js"></script>

</body>
</html>
