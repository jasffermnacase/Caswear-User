<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CASWear - Log In</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="login-page">

    <!-- ======================================================
         BACKGROUND
    ======================================================= -->

    <img
        src="signupcover.png"
        alt="CASWear Background"
        class="login-bg"
    >


    <!-- ======================================================
         LOGIN OVERLAY
    ======================================================= -->

    <div class="login-overlay">

        <div class="login-form">


            <!-- ==================================================
                 TITLE
            =================================================== -->

            <h1 class="login-title">
                LOG IN
            </h1>


            <!-- ==================================================
                 EMAIL
            =================================================== -->

            <label
                for="login-email"
                class="login-label">

                E-mail

            </label>

            <input
                type="email"
                id="login-email"
                class="login-input"
                placeholder="Enter your email"
                autocomplete="email"
            >


            <!-- ==================================================
                 PASSWORD
            =================================================== -->

            <label
                for="login-password"
                class="login-label">

                Password

            </label>

            <input
                type="password"
                id="login-password"
                class="login-input"
                placeholder="Enter your password"
                autocomplete="current-password"
            >

      
            <!-- ==================================================
                 FORGOT PASSWORD
            =================================================== -->

            <div class="forgot-password-container">

                <button
                    type="button"
                    id="forgot-password-btn"
                    class="forgot-password-btn">

                    Forgot Password?

                </button>

            </div>


            <!-- ==================================================
                 LOGIN BUTTON
            =================================================== -->

            <button
                id="login-btn"
                class="login-btn"
                type="button">

                Log In

            </button>


            <!-- ==================================================
                 SIGN UP
            =================================================== -->

            <p class="signup-text">

                Don't have an account yet?

                <a
                    href="signup.html"
                    class="signup-link">

                    Sign Up

                </a>

            </p>


            <!-- ==================================================
                 MESSAGE
            =================================================== -->

            <p
                id="loginMessage"
                class="login-message">
            </p>


        </div>

    </div>

</div>


<!-- ==========================================================
     LOGIN JAVASCRIPT
========================================================== -->

<script
    type="module"
    src="login.js">
</script>


</body>

</html>
